# Builds the sheet and publishes it to GitHub Pages on every push to the
# default branch. The first successful run turns Pages on for the repository
# (configure-pages, enablement: true) — no settings visit needed.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/supabase-artifact-integration-tw9ryi
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Repository variables (Settings → Secrets and variables → Actions →
        # Variables) override the defaults in src/config.js. Any unset variable
        # arrives empty and falls back. These are not secrets: Vite inlines them
        # into the published JavaScript, where any visitor can read them.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
          VITE_DOCTOR_NAME: ${{ vars.VITE_DOCTOR_NAME }}
          VITE_UNIT_LINE: ${{ vars.VITE_UNIT_LINE }}
          VITE_TARGET_MINUTES: ${{ vars.VITE_TARGET_MINUTES }}
          VITE_SHOW_CHIP_RAIL: ${{ vars.VITE_SHOW_CHIP_RAIL }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
